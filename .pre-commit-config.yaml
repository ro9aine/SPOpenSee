repos:
  - repo: local
    hooks:
      - id: flake8
        name: flake8
        entry: poetry run flake8 main.py cutoutcam tests --jobs 1
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: mypy
        name: mypy
        entry: poetry run mypy
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: pytest
        name: pytest
        entry: poetry run pytest -q tests
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: commit-message
        name: commit message
        entry: poetry run python scripts/dev/validate_commit_msg.py
        language: system
        stages: [commit-msg]
