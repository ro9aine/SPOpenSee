repos:
  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        args: ["--jobs", "1", "main.py", "cutoutcam", "tests"]
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: poetry run mypy
        language: system
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: poetry run pytest -q tests
        language: system
        pass_filenames: false
      - id: commit-message
        name: commit message
        entry: poetry run python scripts/dev/validate_commit_msg.py
        language: system
        stages: [commit-msg]
