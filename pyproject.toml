[project]
name = "cutoutcam"
version = "0.1.0"
description = ""
authors = [
    {name = "ro9aine"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10,<3.11"

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
numpy = "^1.21.3"
opencv-python = "^4.5.4"
Pillow = "^8.4.0"
onnxruntime = "1.22"
pyvirtualcam = "^0.14.0"
sounddevice = "^0.5.2"
mediapipe = "0.10.14"
PySide6 = "^6.9.2"



[tool.poetry.group.dev.dependencies]
flake8 = "^7.3.0"
mypy = "^1.19.1"
pre-commit = "^4.3.0"
pytest = "^8.4.2"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.10"
files = ["main.py", "cutoutcam"]
ignore_missing_imports = true
warn_unused_configs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["opensee.*"]
ignore_errors = true

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
